<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    <script>
      // main.py delivers {session, ws_port} via window.initViewer() once the
      // window's DOM is loaded; the React app awaits this promise.
      window.__viewerConfig = new Promise((resolve) => {
        window.initViewer = resolve;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/viewer/main.jsx"></script>
  </body>
</html>
