<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni Executor</title>
  <script src="tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['Cascadia Code', 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', 'DejaVu Sans Mono', 'monospace'],
          },
          keyframes: {
            rise:   { '0%': { opacity: '0', transform: 'translateY(16px) scale(.985)' },
                      '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
            fadein: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            pop:    { '0%': { transform: 'scale(.92)' }, '60%': { transform: 'scale(1.04)' }, '100%': { transform: 'scale(1)' } },
          },
          animation: {
            rise: 'rise .5s cubic-bezier(.22,1,.36,1) both',
            fadein: 'fadein .6s ease both',
            pop: 'pop .25s ease',
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    /* Syntax token colors (spans are generated by app.js) */
    .tok-kw   { @apply text-fuchsia-700 dark:text-[#c792ea]; }
    .tok-str  { @apply text-green-700 dark:text-[#9ece6a]; }
    .tok-num  { @apply text-orange-600 dark:text-[#ff9e64]; }
    .tok-com  { @apply text-slate-400 dark:text-[#5c6178] italic; }
    .tok-fn   { @apply text-blue-600 dark:text-[#82aaff]; }

    /* Things utilities can't express: scrollbars + exact overlay metrics */
    .editor-metrics {
      font-size: 14px;
      line-height: 24px;
      tab-size: 4;
      font-variant-ligatures: none;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { border-radius: 8px; background: rgba(125, 131, 165, .35); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(125, 131, 165, .55); }
    ::-webkit-scrollbar-corner, ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>

<body class="h-screen overflow-hidden font-sans antialiased select-none
             bg-[#eef0f6] text-slate-800
             dark:bg-[#14151d] dark:text-slate-200
             transition-colors duration-300">

  <div class="flex h-full flex-col gap-4 p-5">

    <!-- Header -->
    <header class="flex items-center justify-between px-1 animate-fadein">
      <div class="flex items-center gap-2.5">
        <span class="h-2.5 w-2.5 rounded-full bg-indigo-500 dark:bg-indigo-400"></span>
        <h1 class="text-[15px] font-semibold tracking-wide">Omni Executor</h1>
        <span class="rounded-full border border-slate-300 px-2 py-0.5 text-[10px] font-medium uppercase tracking-wider text-slate-500
                     dark:border-white/10 dark:text-slate-400 transition-colors duration-300">Lua</span>
      </div>

      <!-- Theme switch -->
      <button id="theme-toggle" aria-label="Toggle dark / light mode" title="Toggle theme"
              class="relative h-8 w-[60px] rounded-full border border-slate-300 bg-white
                     dark:border-white/10 dark:bg-[#232636]
                     transition-colors duration-300 outline-none
                     focus-visible:ring-2 focus-visible:ring-indigo-400/60">
        <!-- knob -->
        <span id="theme-knob"
              class="absolute left-1 top-1 flex h-6 w-6 items-center justify-center rounded-full
                     bg-indigo-500 text-white shadow-md
                     transition-transform duration-300 ease-out translate-x-0 dark:translate-x-[28px]">
          <!-- sun -->
          <svg id="icon-sun" class="hidden h-3.5 w-3.5 dark:hidden" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19" />
          </svg>
          <!-- moon -->
          <svg id="icon-moon" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.6 14.6A8.6 8.6 0 0 1 9.4 3.4 8.6 8.6 0 1 0 20.6 14.6Z" />
          </svg>
        </span>
      </button>
    </header>

    <!-- Editor card -->
    <main class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl
                 border border-slate-200 bg-white shadow-[0_10px_40px_-12px_rgba(15,20,40,.15)]
                 dark:border-white/[.06] dark:bg-[#1c1e29] dark:shadow-[0_10px_40px_-12px_rgba(0,0,0,.55)]
                 transition-colors duration-300 animate-rise">

      <!-- Toolbar -->
      <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2.5
                  dark:border-white/[.06] transition-colors duration-300">
        <div class="flex items-center gap-2 text-[12.5px] text-slate-500 dark:text-slate-400">
          <svg class="h-3.5 w-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" /><path d="M14 2v6h6" />
          </svg>
          <span class="font-medium">untitled.lua</span>
          <span id="dirty-dot" class="h-1.5 w-1.5 rounded-full bg-amber-400 opacity-0 transition-opacity duration-300"></span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="btn-copy"
                  class="rounded-lg px-2.5 py-1 text-[12px] font-medium text-slate-500 dark:text-slate-400
                         hover:bg-slate-100 hover:text-slate-800 dark:hover:bg-white/[.06] dark:hover:text-slate-100
                         active:scale-95 transition-all duration-150 outline-none
                         focus-visible:ring-2 focus-visible:ring-indigo-400/60">Copy</button>
          <button id="btn-clear"
                  class="rounded-lg px-2.5 py-1 text-[12px] font-medium text-slate-500 dark:text-slate-400
                         hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-400/10 dark:hover:text-red-300
                         active:scale-95 transition-all duration-150 outline-none
                         focus-visible:ring-2 focus-visible:ring-indigo-400/60">Clear</button>
        </div>
      </div>

      <!-- Code area -->
      <div class="flex min-h-0 flex-1">
        <!-- Line numbers -->
        <div id="gutter"
             class="editor-metrics w-14 shrink-0 overflow-hidden whitespace-pre py-4 pr-3 text-right font-mono
                    text-slate-300 dark:text-[#3d4157] transition-colors duration-300"></div>

        <!-- Highlight layer + input overlay -->
        <div class="relative min-w-0 flex-1">
          <pre id="highlight" aria-hidden="true"
               class="editor-metrics pointer-events-none absolute inset-0 m-0 overflow-hidden whitespace-pre
                      py-4 pr-4 font-mono text-slate-800 dark:text-[#e6e8f0] transition-colors duration-300"><code id="highlight-code"></code></pre>

          <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
                    class="editor-metrics absolute inset-0 resize-none overflow-auto whitespace-pre
                           bg-transparent py-4 pr-4 font-mono text-transparent
                           caret-indigo-600 dark:caret-indigo-400 outline-none
                           selection:bg-indigo-500/20 dark:selection:bg-indigo-400/25"></textarea>
        </div>
      </div>

      <!-- Status bar -->
      <div class="flex items-center justify-between border-t border-slate-200 px-4 py-2
                  text-[11.5px] text-slate-400 dark:border-white/[.06] dark:text-slate-500
                  transition-colors duration-300">
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span> Ready
          </span>
          <span id="stat-chars"></span>
        </div>
        <div class="flex items-center gap-3">
          <span id="stat-pos">Ln 1, Col 1</span>
          <span>UTF-8</span>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
